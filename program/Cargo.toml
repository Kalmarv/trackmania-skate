[package]
name = "trackmania-export"
version.workspace = true
license.workspace = true
repository = "https://github.com/Kalmarv/trackmania-skate"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
primase-core.workspace = true
primase-trackmania.workspace = true
primase-reskate.workspace = true
primase-meshops.workspace = true
primase-image.workspace = true
primase-gltf.workspace = true
primase-foundations = { workspace = true, features = ["compress"] }
serde_json.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "trackmania-export"
path = "src/main.rs"

[package.metadata.dist]
# not on crates.io, but each release has its binary
dist = true
