[package]
name = "trackmania-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# primase is a library this program uses, pinned by git revision on primase main (no path checkout, no fork):
# d827770db, primase main with its TrackMania reader.
[dependencies]
primase-core = { git = "https://github.com/kalmarv/primase.git", rev = "d827770db33dae37c7409986c22c4b8f25fc8631" }
primase-trackmania = { git = "https://github.com/kalmarv/primase.git", rev = "d827770db33dae37c7409986c22c4b8f25fc8631" }
primase-reskate = { git = "https://github.com/kalmarv/primase.git", rev = "d827770db33dae37c7409986c22c4b8f25fc8631" }
primase-meshops = { git = "https://github.com/kalmarv/primase.git", rev = "d827770db33dae37c7409986c22c4b8f25fc8631" }
primase-image = { git = "https://github.com/kalmarv/primase.git", rev = "d827770db33dae37c7409986c22c4b8f25fc8631" }
primase-gltf = { git = "https://github.com/kalmarv/primase.git", rev = "d827770db33dae37c7409986c22c4b8f25fc8631" }
primase-foundations = { git = "https://github.com/Kalmarv/primase-foundations", rev = "f9cf4ece1de77fce9d703c63347dd70b728b7c0e", features = ["compress"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "trackmania-export"
path = "src/main.rs"
