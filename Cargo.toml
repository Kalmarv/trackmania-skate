# The TrackMania Nations Forever conversion (program/: the recipe) and its tooling (tools/trackmania-tools: packaging
# and the skate. run commands), one workspace so primase is built once.
[workspace]
members = ["program", "tools/trackmania-tools"]
resolver = "3"

# primase is a library this workspace uses, pinned once by git revision on primase main (no path checkout, no fork):
# 364a33cb, primase main. primase-foundations is the crates.io version primase main uses, so the lockfile holds one.
[workspace.dependencies]
primase-core = { git = "https://github.com/kalmarv/primase.git", rev = "364a33cb054cbf799ecce8258c0907e11fe156f9" }
primase-trackmania = { git = "https://github.com/kalmarv/primase.git", rev = "364a33cb054cbf799ecce8258c0907e11fe156f9" }
primase-reskate = { git = "https://github.com/kalmarv/primase.git", rev = "364a33cb054cbf799ecce8258c0907e11fe156f9" }
primase-meshops = { git = "https://github.com/kalmarv/primase.git", rev = "364a33cb054cbf799ecce8258c0907e11fe156f9" }
primase-image = { git = "https://github.com/kalmarv/primase.git", rev = "364a33cb054cbf799ecce8258c0907e11fe156f9" }
primase-gltf = { git = "https://github.com/kalmarv/primase.git", rev = "364a33cb054cbf799ecce8258c0907e11fe156f9" }
primase-foundations = "0.3.1"
trackmania-export = { path = "program" }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
