[package]
name = "trackmania-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# The tooling around the conversion: the release packaging (mod folders, icons, zips) and the skate. console commands
# of an in-game check. Not the conversion.
[dependencies]
trackmania-export = { path = "../../program" }
primase-image = { git = "https://github.com/kalmarv/primase.git", rev = "1f0952904" }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
